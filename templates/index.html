<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcard Generator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; text-align: center; padding: 0 16px; }
    textarea { width: 100%; height: 100px; font-size: 16px; box-sizing: border-box; padding: 8px; }
    button { font-size: 16px; padding: 10px 18px; margin: 5px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    .scene { perspective: 1000px; margin: 24px 0 8px; }
    .card { position: relative; width: 100%; min-height: 200px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
    .card.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center; border: 2px solid #333;
            border-radius: 12px; padding: 30px; box-sizing: border-box; font-size: 20px; background: #fff; }
    .back { transform: rotateY(180deg); background: #eef5ff; }
    .hint { color: #555; font-size: 14px; }
    #score { font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Flashcard Generator</h1>

  <textarea id="topic" placeholder="Type a topic or paste your notes here"></textarea><br>
  <button id="genBtn" onclick="generate()">Generate Cards</button>

  <div class="hint" id="progress"></div>

  <div class="scene">
    <div class="card" id="card" onclick="flip()">
      <div class="face front" id="front">Your question will appear here.</div>
      <div class="face back" id="back"></div>
    </div>
  </div>
  <div class="hint">Click the card to flip it and reveal the answer.</div>

  <p>
    <button id="wrongBtn" onclick="mark(false)" disabled>I got it wrong</button>
    <button id="rightBtn" onclick="mark(true)" disabled>I got it right</button>
    <button id="nextBtn" onclick="nextCard()" disabled>Next</button>
  </p>

  <div>Score: <span id="score">0 / 0</span></div>

  <script>
    let cards = [];
    let index = 0;
    let correct = 0;
    let answered = 0;
    let flipped = false;
    let marked = false;

    const cardEl = document.getElementById("card");
    const frontEl = document.getElementById("front");
    const backEl = document.getElementById("back");
    const progressEl = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const genBtn = document.getElementById("genBtn");
    const rightBtn = document.getElementById("rightBtn");
    const wrongBtn = document.getElementById("wrongBtn");
    const nextBtn = document.getElementById("nextBtn");

    async function generate() {
      const topic = document.getElementById("topic").value;
      genBtn.disabled = true;
      frontEl.textContent = "Generating...";
      backEl.textContent = "";
      cardEl.classList.remove("flipped");
      flipped = false;
      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: topic })
        });
        const data = await res.json();
        if (!res.ok) {
          frontEl.textContent = data.error;
          cards = [];
        } else {
          cards = data;
          index = 0;
          correct = 0;
          answered = 0;
          showCard();
        }
      } catch (err) {
        frontEl.textContent = "Something went wrong. Is the server running?";
        cards = [];
      }
      genBtn.disabled = false;
      updateScore();
      updateButtons();
    }

    function showCard() {
      const card = cards[index];
      cardEl.classList.remove("flipped");
      flipped = false;
      marked = false;
      frontEl.textContent = card.question;
      backEl.textContent = card.answer;
      progressEl.textContent = `Card ${index + 1} of ${cards.length}`;
      updateButtons();
    }

    function flip() {
      if (!cards.length) return;
      flipped = !flipped;
      cardEl.classList.toggle("flipped", flipped);
      updateButtons();
    }

    function mark(isCorrect) {
      if (!cards.length || !flipped || marked) return;
      marked = true;
      answered++;
      if (isCorrect) correct++;
      updateScore();
      updateButtons();
    }

    function nextCard() {
      if (!cards.length) return;
      if (index + 1 < cards.length) {
        index++;
        showCard();
      } else {
        finish();
      }
    }

    function finish() {
      cards = [];
      cardEl.classList.remove("flipped");
      flipped = false;
      frontEl.textContent = `Deck complete! You got ${correct} of ${answered} right.`;
      backEl.textContent = "";
      progressEl.textContent = "Generate a new deck to study again.";
      updateButtons();
    }

    function updateScore() {
      scoreEl.textContent = `${correct} / ${answered}`;
    }

    function updateButtons() {
      const hasCards = cards.length > 0;
      rightBtn.disabled = !(hasCards && flipped && !marked);
      wrongBtn.disabled = !(hasCards && flipped && !marked);
      nextBtn.disabled = !hasCards || !marked;
    }
  </script>
</body>
</html>
